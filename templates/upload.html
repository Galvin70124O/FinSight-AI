{% extends 'base.html' %}
{% block content %}
<section class="auth-wrap">
  <div class="auth-card upload-card">
    <div class="auth-brand">
      <div class="auth-logo" aria-hidden="true">
        <svg viewBox="0 0 64 64">
          <path d="M16 44V18C16 14.6863 18.6863 12 22 12H44C47.3137 12 50 14.6863 50 18V44" stroke="currentColor" stroke-width="6" stroke-linecap="round"/>
          <path d="M24 44V28" stroke="currentColor" stroke-width="6" stroke-linecap="round"/>
          <path d="M32 44V34" stroke="currentColor" stroke-width="6" stroke-linecap="round"/>
          <path d="M40 44V24" stroke="currentColor" stroke-width="6" stroke-linecap="round"/>
        </svg>
      </div>
      <div>
        <h2>Import transaction history</h2>
        <p>Upload a CSV with `Date`, `Category`, `Amount`, `Type`, and `Description` columns.</p>
      </div>
    </div>
    <form method="post" enctype="multipart/form-data" class="auth-form">
      <label class="upload-file">
        <span>Select CSV file</span>
        <input type="file" name="file" accept=".csv" required>
      </label>
      <button class="action-button full" type="submit">Import data</button>
    </form>
  </div>
</section>
{% endblock %}
