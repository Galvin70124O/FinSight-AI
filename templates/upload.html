{% extends 'base.html' %}
{% block content %}
<section class="auth-wrap">
  <div class="auth-card upload-card">
    <div class="auth-brand">
      <div class="auth-logo" aria-hidden="true">
        <svg viewBox="0 0 64 64">
          <path d="M16 44V18C16 14.6863 18.6863 12 22 12H44C47.3137 12 50 14.6863 50 18V44" stroke="url(#brandStroke)" stroke-width="6" stroke-linecap="round"/>
          <path d="M24 44V28" stroke="url(#brandStroke)" stroke-width="6" stroke-linecap="round"/>
          <path d="M32 44V34" stroke="url(#brandStroke)" stroke-width="6" stroke-linecap="round"/>
          <path d="M40 44V24" stroke="url(#brandStroke)" stroke-width="6" stroke-linecap="round"/>
          <defs>
            <linearGradient id="brandStroke" x1="16" y1="12" x2="50" y2="44" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#2DD4BF"/>
              <stop offset="55%" stop-color="#38BDF8"/>
              <stop offset="100%" stop-color="#8B5CF6"/>
            </linearGradient>
          </defs>
        </svg>
      </div>
      <div>
        <h2>Import transaction history</h2>
        <p>Upload a CSV with Date, Category, Amount, Type, and Description columns to generate analytics.</p>
      </div>
    </div>
    <form method="post" enctype="multipart/form-data" class="auth-form">
      <label class="upload-file">
        <span>Select CSV file</span>
        <input type="file" name="file" accept=".csv" required>
      </label>
      <button class="action-button full" type="submit">Import data</button>
    </form>
  </div>
</section>
{% endblock %}
