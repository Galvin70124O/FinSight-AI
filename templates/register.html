{% extends 'base.html' %}
{% from '_macros.html' import logo_mark %}
{% block title %}Create account · FinSight AI{% endblock %}
{% block content %}
<section class="auth">
  <div class="auth-card">
    <div class="auth-head">
      {{ logo_mark() }}
      <h1 class="auth-title">Create your account</h1>
      <p class="tile-sub">Import a CSV or load demo data once you’re in.</p>
    </div>
    <form method="post" class="form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label class="field">
        <span>Username</span>
        <input class="input" type="text" name="username" autocomplete="username" required autofocus>
      </label>
      <label class="field">
        <span>Email</span>
        <input class="input" type="email" name="email" autocomplete="email" required>
      </label>
      <div class="field-pair">
        <label class="field">
          <span>Password</span>
          <input class="input" type="password" name="password" autocomplete="new-password" required>
        </label>
        <label class="field">
          <span>Confirm password</span>
          <input class="input" type="password" name="confirm_password" autocomplete="new-password" required>
        </label>
      </div>
      <button class="btn btn-primary btn-block" type="submit">Create account</button>
    </form>
    <p class="auth-switch">Already have an account? <a class="link" href="{{ url_for('auth.login') }}">Sign in</a></p>
  </div>
</section>
{% endblock %}
