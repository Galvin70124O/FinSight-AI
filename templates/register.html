{% extends 'base.html' %}
{% block content %}
<section class="auth-wrap">
  <div class="auth-card">
    <div class="auth-brand">
      <div class="auth-logo" aria-hidden="true">
        <svg viewBox="0 0 64 64">
          <path d="M16 44V18C16 14.6863 18.6863 12 22 12H44C47.3137 12 50 14.6863 50 18V44" stroke="currentColor" stroke-width="6" stroke-linecap="round"/>
          <path d="M24 44V28" stroke="currentColor" stroke-width="6" stroke-linecap="round"/>
          <path d="M32 44V34" stroke="currentColor" stroke-width="6" stroke-linecap="round"/>
          <path d="M40 44V24" stroke="currentColor" stroke-width="6" stroke-linecap="round"/>
        </svg>
      </div>
      <div>
        <h2>Create your account</h2>
        <p>Join FinSight AI and turn your finances into clear intelligence.</p>
      </div>
    </div>
    <form method="post" class="auth-form">
      <label>
        <span>Username</span>
        <input type="text" name="username" required>
      </label>
      <label>
        <span>Email</span>
        <input type="email" name="email" required>
      </label>
      <label>
        <span>Password</span>
        <input type="password" name="password" required>
      </label>
      <label>
        <span>Confirm Password</span>
        <input type="password" name="confirm_password" required>
      </label>
      <button class="action-button full" type="submit">Create account</button>
    </form>
  </div>
</section>
{% endblock %}
